# What a build script cannot set (README.md of the crate jflib).  rust-lld comes with rustup.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[target.aarch64-pc-windows-msvc]
linker = "rust-lld"

# Linux: jfs and scripttest are command-line programs, each one static file.  Always build with
# --target x86_64-unknown-linux-gnu, also on Linux: these flags then reach only the programs, not
# the build scripts (linked by cc).  The linker is set here and not as `linker`, which would reach
# them too.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "linker=rust-lld", "-C", "linker-flavor=ld.lld", "-C", "relocation-model=static", "-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "linker=rust-lld", "-C", "linker-flavor=ld.lld", "-C", "relocation-model=static", "-C", "target-feature=+crt-static"]
